<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена — Евгений Андреев</title>
<style>
:root{color-scheme:dark;--ink:#050505;--surface:#0B0B0C;--line:#2a2a2c;--text:#f4efe7;--muted:#8a8278;--fire:#c8912f;--fire-hot:#e8ba60;--on-accent:#0a0603;font-family:'Golos Text',system-ui,sans-serif;margin:0}
body{background:var(--ink);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.card{max-width:540px;background:linear-gradient(160deg,#0d0d0e,#060607);border:1px solid var(--line);border-radius:28px;padding:42px 32px}
.kick{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fire);margin-bottom:14px}
h1{font-family:'Oswald',Impact,sans-serif;font-size:clamp(40px,8vw,72px);line-height:1;letter-spacing:-.02em;text-transform:uppercase;margin:0 0 16px}
p{color:var(--muted);margin:0 0 28px;line-height:1.6}
a.btn{display:inline-block;background:var(--fire);color:var(--on-accent);text-decoration:none;font-weight:700;padding:14px 24px;border-radius:18px;letter-spacing:.02em}
a.btn:hover{color:var(--on-accent);box-shadow:0 10px 28px #c8912f55}
</style>
</head>
<body>
<div class="card">
  <div class="kick">404 · Страница не найдена</div>
  <h1>Здесь пусто</h1>
  <p>Адрес устарел, или страница переехала. Вернитесь на главную — там вся навигация и контакты.</p>
  <a class="btn" href="https://andreevgeny.github.io/ux/">← На главную</a>
</div>
</body>
</html>
